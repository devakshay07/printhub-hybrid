name: Build Windows EXE

on:
  push:
    paths:
      - 'print_bridge.py'
      - 'version.json'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller supabase requests python-dotenv
        
    - name: Compile Windows Executable
      run: pyinstaller --onefile --name PrintBridge print_bridge.py
      
    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrintBridge-Windows
        path: dist/PrintBridge.exe

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        name: "PrintBridge Engine Latest"
        body: "Automated production build of PrintBridge engine for Windows."
        draft: false
        prerelease: false
        files: dist/PrintBridge.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
