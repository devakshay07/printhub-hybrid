name: Build Windows EXE

on:
  push:
    paths:
      - 'print_bridge.py'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller supabase requests python-dotenv
        
    - name: Compile Windows Executable
      run: pyinstaller --noconsole --onefile --name PrintBridge print_bridge.py
      
    - name: Upload Windows EXE
      uses: actions/upload-artifact@v3
      with:
        name: PrintBridge-Windows
        path: dist/PrintBridge.exe
