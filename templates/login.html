{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 4rem auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #111; margin-top: 0; text-transform: uppercase;">Agent Login</h2>
    <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 2rem;">Authenticate hardware to access PrintHub network.</p>
    
    {% if error %}
    <div style="background: #f8d7da; color: #721c24; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; text-align: center; font-weight: bold; font-size: 0.9rem;">{{ error }}</div>
    {% endif %}
    
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label>Shop Owner Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-dark" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">Bind Device & Login</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; font-family: monospace; color: #aaa; font-size: 0.75rem;">
        HWID: {{ hwid }}
    </div>
</div>
{% endblock %}
