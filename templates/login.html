{% extends "base.html" %}
{% set hide_navbar = True %}

{% block content %}
<div class="min-h-[80vh] flex flex-col items-center justify-center p-4">
    <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl max-w-md w-full border border-slate-100 fade-in">
        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner"><i data-lucide="shield-check" class="w-8 h-8"></i></div>
        <h2 class="text-2xl font-extrabold text-slate-800 text-center mb-2 tracking-tight">Enclave Authentication</h2>
        <p class="text-sm text-slate-500 text-center mb-8 font-medium">Connect this machine to your PrintHub network.</p>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl text-sm font-bold border border-red-200 mb-6 flex items-center gap-2">
            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Supabase Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="mail" class="w-5 h-5 text-slate-400"></i></div>
                    <input type="email" name="email" required placeholder="admin@printhub.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="key-round" class="w-5 h-5 text-slate-400"></i></div>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 outline-none transition-all font-mono">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95 flex items-center justify-center gap-2 mt-4">
                <i data-lucide="log-in" class="w-5 h-5"></i> Establish Uplink
            </button>
        </form>
    </div>
    
    <div class="mt-8 text-center text-xs text-slate-400 font-mono tracking-widest fade-in flex flex-col items-center gap-2">
        <i data-lucide="cpu" class="w-4 h-4"></i>
        <span>HWID: {{ hwid }}</span>
    </div>
</div>
{% endblock %}
