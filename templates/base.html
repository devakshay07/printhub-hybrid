<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintHub Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="text-slate-900 min-h-screen flex flex-col">
    {% if not hide_navbar %}
    <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="terminal" class="w-5 h-5 text-white"></i></div>
                    <span class="font-bold text-lg sm:text-xl tracking-tight">PrintHub Agent</span>
                </div>
                <div class="flex items-center gap-4 sm:gap-6">
                    <a href="{{ url_for('dashboard') }}" class="flex items-center gap-2 text-sm font-medium {% if request.endpoint == 'dashboard' %}text-blue-400{% else %}text-slate-300 hover:text-white{% endif %} transition-colors"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span class="hidden sm:inline">Orders</span></a>
                    <a href="{{ url_for('settings') }}" class="flex items-center gap-2 text-sm font-medium {% if request.endpoint == 'settings' %}text-blue-400{% else %}text-slate-300 hover:text-white{% endif %} transition-colors"><i data-lucide="settings" class="w-4 h-4"></i><span class="hidden sm:inline">Settings</span></a>
                    <a href="{{ url_for('logout') }}" class="flex items-center gap-2 text-sm font-medium text-slate-300 hover:text-red-400 transition-colors ml-2 sm:ml-4 border-l border-slate-700 pl-4 sm:pl-6"><i data-lucide="log-out" class="w-4 h-4"></i></a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}
    
    <main class="max-w-6xl mx-auto w-full p-4 sm:p-6 lg:p-8 fade-in flex-1">
        {% block content %}{% endblock %}
    </main>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
