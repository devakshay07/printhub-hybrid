<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintHub Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="lib/lucide.min.js"></script>
        <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide { display: none !important; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen">
    <!-- Auth Screen -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-lg border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-blue-600/30">
                    <i data-lucide="printer" class="text-white w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Agent Login</h1>
                <p class="text-sm font-medium text-slate-500 mt-2">Enter your credentials to access the terminal.</p>
            </div>
            
            <div id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-medium text-slate-900 focus:border-blue-600 focus:bg-white outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-medium text-slate-900 focus:border-blue-600 focus:bg-white outline-none transition-colors">
                </div>
                <div id="login-error" class="text-sm font-bold text-red-600 hidden bg-red-50 p-3 rounded-lg border border-red-100"></div>
                <button type="button" id="btn-login-submit" onclick="handleLogin(event)" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 mt-4">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Authenticate
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hide max-w-5xl mx-auto p-4 sm:p-8">
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-md">
                    <i data-lucide="printer" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight">PrintHub Terminal</h1>
                    <p class="text-sm font-medium text-slate-500" id="shop-name">Loading shop...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-sync" class="bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-all active:scale-95">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sync
                </button>
                <button id="btn-logout" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-sm font-bold transition-colors">
                    Logout
                </button>
            </div>
        </header>

        <div id="lock-container"></div>

        <div id="empty-state" class="hide bg-white border border-slate-200 rounded-3xl p-12 text-center shadow-sm">
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100"><i data-lucide="inbox" class="w-8 h-8 text-slate-300"></i></div>
            <h3 class="text-lg font-bold text-slate-700 mb-1">Awaiting Orders</h3>
            <p class="text-slate-500 text-sm">No active orders right now. Waiting for incoming customer orders...</p>
        </div>

        <div id="orders-container" class="space-y-6">
            <!-- Orders injected here -->
        </div>
    </div>
</div>


    <div id="debug-log" class="fixed bottom-0 right-0 w-full md:w-1/3 bg-slate-900 text-green-400 font-mono text-xs p-4 h-48 overflow-y-auto z-50 border-t-2 border-slate-700">
        <div>=== SYSTEM DIAGNOSTICS ===</div>
    </div>

<script>
    const SUPABASE_URL = 'https://mzkizzakuporgzljealz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16a2l6emFrdXBvcmd6bGplYWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNTY0MzQsImV4cCI6MjEwNjgzMjQzNH0.6s21aw_xhbaAJiNeT5x_qi3sZeDfi68yKflj-3M0Z-o';
    
    function sysLog(msg) {
        console.log(msg);
        const logEl = document.getElementById('debug-log');
        if (logEl) {
            logEl.innerHTML += `<div>[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
    }
    
    sysLog('SYSTEM BOOTING (NATIVE MODE)...');

    let currentSession = null;
    let shopId = null;
    let refreshInterval = null;

    // Initialize UI
    if(window.lucide) { try { lucide.createIcons(); } catch(e){} }

    const authScreen = document.getElementById('auth-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const ordersContainer = document.getElementById('orders-container');
    const emptyState = document.getElementById('empty-state');
    const shopNameEl = document.getElementById('shop-name');

    async function supabaseFetch(endpoint, method = 'GET', body = null, useAuth = true) {
        const headers = {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
        };
        if (useAuth && currentSession) {
            headers['Authorization'] = `Bearer ${currentSession.access_token}`;
        }
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        const res = await fetch(`${SUPABASE_URL}${endpoint}`, options);
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.message || err.error_description || `HTTP ${res.status}`);
        }
        return res.json().catch(() => null);
    }

    window.handleLogin = async function(e) {
        if(e) e.preventDefault();
        sysLog('LOGIN BUTTON CLICKED');
        try {
            loginError.classList.add('hidden');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login-submit');
            const oldText = btn.innerHTML;
            btn.innerHTML = 'Authenticating...';
            btn.disabled = true;

            const data = await supabaseFetch('/auth/v1/token?grant_type=password', 'POST', { email, password }, false);
            
            sysLog('AUTH SUCCESS: Token received.');
            currentSession = data;
            
            authScreen.classList.add('hide');
            dashboardScreen.classList.remove('hide');
            loadShopData();
            
            btn.innerHTML = oldText;
            btn.disabled = false;
        } catch (err) {
            sysLog('LOGIN FATAL EXCEPTION: ' + err.message);
            loginError.textContent = "Fatal: " + err.message;
            loginError.classList.remove('hidden');
            const btn = document.getElementById('btn-login-submit');
            btn.innerHTML = 'Authenticate';
            btn.disabled = false;
        }
    };

    document.getElementById('btn-logout').addEventListener('click', () => {
        currentSession = null;
        authScreen.classList.remove('hide');
        dashboardScreen.classList.add('hide');
        if(refreshInterval) clearInterval(refreshInterval);
    });

    async function loadShopData() {
        try {
            const shops = await supabaseFetch(`/rest/v1/printhub_shops?owner_uid=eq.${currentSession.user.id}&select=id,shop_name`);
            if (shops && shops.length > 0) {
                shopId = shops[0].id;
                shopNameEl.textContent = shops[0].shop_name;
                sysLog(`Shop locked: ${shopId}`);
                fetchOrders();
                refreshInterval = setInterval(fetchOrders, 5000);
            } else {
                sysLog('No shop found for this user.');
                alert('No shop linked to this account.');
            }
        } catch (e) {
            sysLog('Error loading shop: ' + e.message);
        }
    }

    async function fetchOrders() {
        if (!shopId) return;
        try {
            const orders = await supabaseFetch(`/rest/v1/printhub_orders?shop_id=eq.${shopId}&order=created_at.desc`);
            renderOrders(orders || []);
        } catch (e) {
            sysLog('Queue fetch error: ' + e.message);
        }
    }

    window.updateOrderStatus = async function(orderId, newStatus) {
        try {
            await supabaseFetch(`/rest/v1/printhub_orders?id=eq.${orderId}`, 'PATCH', { status: newStatus });
            sysLog(`Order ${orderId.substring(0,8)} marked as ${newStatus}`);
            fetchOrders();
        } catch (e) {
            sysLog('Failed to update status: ' + e.message);
            alert('Failed to update status');
        }
    }

    window.handleMarkPaid = function(orderId) {
        updateOrderStatus(orderId, 'Paid');
    }

    window.verifyOtp = async function(orderId, otpInput) {
        try {
            const orders = await supabaseFetch(`/rest/v1/printhub_orders?id=eq.${orderId}&select=otp`);
            if (orders && orders.length > 0) {
                if (orders[0].otp === otpInput) {
                    await supabaseFetch(`/rest/v1/printhub_orders?id=eq.${orderId}`, 'PATCH', { otp_verified: true });
                    sysLog(`OTP Verified for ${orderId.substring(0,8)}`);
                    fetchOrders();
                    return true;
                }
            }
            return false;
        } catch (e) {
            sysLog('OTP check failed: ' + e.message);
            return false;
        }
    }

    window.handleVerifyOtp = async function(e, orderId) {
        e.preventDefault();
        const form = e.target;
        const input = form.querySelector('input');
        const btn = form.querySelector('button');
        const otp = input.value.trim();
        if(otp.length !== 4) return;
        
        btn.disabled = true;
        const oldText = btn.innerHTML;
        btn.innerHTML = 'Verifying...';
        
        const success = await verifyOtp(orderId, otp);
        if(!success) {
            input.classList.add('border-red-500', 'text-red-500', 'animate-shake');
            setTimeout(() => {
                input.classList.remove('border-red-500', 'text-red-500', 'animate-shake');
                input.value = '';
            }, 1000);
            btn.innerHTML = oldText;
            btn.disabled = false;
        }
    }

    function renderOrders(orders) {
        if (!orders || orders.length === 0) {
            emptyState.classList.remove('hidden', 'hide');
            ordersContainer.innerHTML = '';
            return;
        }
        
        emptyState.classList.add('hidden', 'hide');
        let html = '';
        
        orders.forEach(order => {
            const isUrgent = order.is_urgent;
            const statusColor = order.status === 'Pending' ? 'bg-amber-100 text-amber-700 border-amber-200' : 
                              (order.status === 'Paid' ? 'bg-blue-100 text-blue-700 border-blue-200' : 
                              'bg-green-100 text-green-700 border-green-200');
                              
            let otpSection = '';
            if (order.status === 'Paid') {
                if (!order.otp_verified) {
                    otpSection = `
                        <form onsubmit="handleVerifyOtp(event, '${order.id}')" class="mt-4 flex gap-2">
                            <input type="text" maxlength="4" placeholder="Enter 4-digit PIN" required class="flex-1 bg-slate-50 border-2 border-slate-200 rounded-lg px-3 py-2 text-center tracking-widest font-bold text-slate-900 focus:border-blue-600 outline-none transition-colors">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-colors">Verify & Print</button>
                        </form>
                    `;
                } else {
                    otpSection = `
                        <div class="mt-4 flex items-center justify-center gap-2 bg-green-50 text-green-700 p-3 rounded-lg border border-green-200 font-bold">
                            <i data-lucide="check-circle" class="w-5 h-5"></i> PIN Verified - Sent to Printer
                        </div>
                    `;
                }
            } else if (order.status === 'Pending' && order.payment_mode === 'cash') {
                otpSection = `
                    <div class="mt-4">
                        <button onclick="handleMarkPaid('${order.id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="coins" class="w-5 h-5"></i> Mark as Paid (Cash Collected)
                        </button>
                    </div>
                `;
            }

            html += `
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 relative overflow-hidden group">
                ${isUrgent ? '<div class="absolute top-0 right-0 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg">URGENT</div>' : ''}
                
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <div class="text-xs font-bold text-slate-400 mb-1">ORDER ID</div>
                        <div class="font-mono text-sm text-slate-900 bg-slate-100 px-2 py-1 rounded-md">#${order.id.substring(0,8)}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-bold text-slate-400 mb-1">STATUS</div>
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold border ${statusColor}">
                            ${order.status}
                        </span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                        <div class="text-xs font-bold text-slate-400 mb-1">TOTAL AMOUNT</div>
                        <div class="text-xl font-black text-slate-900">₹${order.total_amount}</div>
                    </div>
                    <div class="bg-slate-50 rounded-xl p-3 border border-slate-100">
                        <div class="text-xs font-bold text-slate-400 mb-1">PAYMENT MODE</div>
                        <div class="text-sm font-bold text-slate-700 capitalize flex items-center gap-1">
                            ${order.payment_mode === 'cash' ? '<i data-lucide="banknote" class="w-4 h-4"></i>' : '<i data-lucide="credit-card" class="w-4 h-4"></i>'}
                            ${order.payment_mode}
                        </div>
                    </div>
                </div>
                
                ${otpSection}
            </div>`;
        });

        ordersContainer.innerHTML = html;
        if(window.lucide) { try { lucide.createIcons(); } catch(e){} }
    }
</script>
<style>
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
    .animate-shake { animation: shake 0.2s ease-in-out 0s 2; }
</style>

</body>
</html>
