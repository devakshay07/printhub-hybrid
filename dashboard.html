<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintHub Agent Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hide { display: none !important; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen relative pb-48">
    <!-- Auth Screen -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-lg border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center mb-4 shadow-lg shadow-blue-600/30">
                    <svg class="text-white w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Agent Login</h1>
                <p class="text-sm font-medium text-slate-500 mt-2">Enter your credentials to access the terminal.</p>
            </div>

            <div id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-medium text-slate-900 focus:border-blue-600 focus:bg-white outline-none transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                    <input type="password" id="password" required class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-medium text-slate-900 focus:border-blue-600 focus:bg-white outline-none transition-colors">
                </div>
                <div id="login-error" class="text-sm font-bold text-red-600 hidden bg-red-50 p-3 rounded-lg border border-red-100"></div>
                <button type="button" id="btn-login-submit" onclick="handleLogin(event)" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2 mt-4">
                    Authenticate
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hide max-w-5xl mx-auto p-4 sm:p-8">
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/30">
                    <svg class="text-white w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-900 tracking-tight" id="shop-name">Loading...</h1>
                    <p class="text-sm font-bold text-emerald-600 bg-emerald-50 inline-block px-2 py-0.5 rounded-md mt-1">SaaS Agent Connected</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="btn-sync" onclick="loadOrders()" class="bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all">Sync</button>
                <button id="btn-logout" onclick="handleLogout()" class="bg-red-50 text-red-600 hover:bg-red-100 px-4 py-2 rounded-xl text-sm font-bold transition-colors">Logout</button>
            </div>
        </header>
        <div id="orders-container" class="space-y-6 text-center pt-10 font-bold text-slate-500">Awaiting Orders...</div>
    </div>
</div>

<div id="debug-log" class="fixed bottom-0 right-0 w-full bg-slate-900 text-green-400 font-mono text-xs p-4 h-48 overflow-y-auto z-50 border-t-2 border-slate-700">
    <div>=== SYSTEM DIAGNOSTICS ===</div>
</div>

<script>
    const sysLog = (msg) => {
        console.log(msg);
        const logEl = document.getElementById('debug-log');
        if (logEl) {
            logEl.innerHTML += `<div>[${new Date().toISOString().split('T')[1].slice(0,-1)}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }
    };
    
    sysLog('SYSTEM BOOTING...');
    sysLog('Script engine is alive and rendering.');

    const SUPABASE_URL = 'https://vukoiwiwokwanonntfhg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1a29pd2l3b2t3YW5vbm50ZmhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMTM3NTAsImV4cCI6MjEwNjc4OTc1MH0.WPDadfj_WNsX6wYirHxNAjU5sSJE0jiycJWToLPOrcQ';
    let sessionToken = null;

    window.handleLogin = async function(e) {
        if(e) e.preventDefault();
        sysLog('LOGIN BUTTON CLICKED');
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('btn-login-submit');
        const loginError = document.getElementById('login-error');
        
        loginError.classList.add('hidden');
        btn.innerHTML = 'Authenticating...';
        btn.disabled = true;

        try {
            sysLog('Fetching from raw Supabase API...');
            const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();
            
            if (!res.ok) {
                sysLog('AUTH ERROR: ' + (data.error_description || data.msg || 'Unknown error'));
                loginError.textContent = data.error_description || data.msg || 'Invalid credentials';
                loginError.classList.remove('hidden');
            } else {
                sysLog('AUTH SUCCESS!');
                sessionToken = data.access_token;
                document.getElementById('auth-screen').classList.add('hide');
                document.getElementById('dashboard-screen').classList.remove('hide');
                loadShopData();
            }
        } catch (err) {
            sysLog('NETWORK ERROR: ' + err.message);
            loginError.textContent = 'Network Error: ' + err.message;
            loginError.classList.remove('hidden');
        }
        
        btn.innerHTML = 'Authenticate';
        btn.disabled = false;
    };

    window.handleLogout = function() {
        sessionToken = null;
        document.getElementById('auth-screen').classList.remove('hide');
        document.getElementById('dashboard-screen').classList.add('hide');
        sysLog('User logged out.');
    };

    async function loadShopData() {
        sysLog('Loading shop data...');
        // Mock data to ensure dashboard works without breaking on SQL RLS
        sysLog('Shop Loaded.');
        document.getElementById('shop-name').textContent = 'Test Print Shop';
        loadOrders();
    }

    function loadOrders() {
        sysLog('Loading Orders (Mock)...');
        document.getElementById('orders-container').innerHTML = `
            <div class="bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-sm text-left">
                <div class="font-bold text-xl text-slate-800">No active orders</div>
                <div class="text-sm text-slate-500">Waiting for customers...</div>
            </div>`;
    }
</script>

</body>
</html>
